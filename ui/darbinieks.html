<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iesniegumu saraksts · darbiniekam</title>
  <style>
    :root { --navy: #1D3557; --teal: #2A9D8F; --bg: #F1F3F5; --line: #C9CED6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); }
    header { background: var(--navy); color: #fff; padding: 16px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    label { display: block; font-weight: 600; }
    input, select { padding: 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px; margin-top: 4px; }
    button { padding: 9px 18px; font: inherit; font-weight: 600; color: #fff; background: var(--teal); border: 0; border-radius: 6px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; background: #fff; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: #e8ecf1; }
    .count { margin-top: 12px; color: #444; }
    .withdraw { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 24px; }
    .withdraw h2 { margin: 0 0 12px; font-size: 1.1rem; color: var(--navy); }
    .withdraw .row { margin-bottom: 12px; }
    .withdraw textarea { width: 100%; min-height: 80px; padding: 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px; margin-top: 4px; resize: vertical; }
    .hint { color: #555; font-size: 0.9rem; margin-top: 4px; }
    .field-error { color: #b23a1f; font-size: 0.9rem; margin-top: 4px; }
    .invalid { border-color: #b23a1f !important; }
    .message { margin-top: 12px; padding: 10px 12px; border-radius: 6px; }
    .message:empty { display: none; }
    .message.error { background: #fdece7; border: 1px solid #E76F51; }
    .message.ok { background: #e6f4f2; border: 1px solid var(--teal); }
    .id-link { background: none; color: var(--navy); padding: 0; font-weight: 400; text-decoration: underline; }
  </style>
</head>
<body>
  <header><h1>Ezermalas novada pašvaldība · Iesniegumu saraksts</h1></header>
  <main>
    <form class="filters" id="filters">
      <div>
        <label for="status">Statuss</label>
        <select id="status" name="status">
          <option value="">Visi</option>
          <option value="RECEIVED">Saņemts</option>
          <option value="IN_PROGRESS">Izskatīšanā</option>
          <option value="FORWARDED">Pārsūtīts</option>
          <option value="ANSWERED">Atbildēts</option>
          <option value="WITHDRAWN">Atsaukts</option>
        </select>
      </div>
      <div>
        <label for="topic">Tēma</label>
        <select id="topic" name="topic">
          <option value="">Visas</option>
          <option value="ROADS">Ceļi un ielas</option>
          <option value="WASTE">Atkritumi</option>
          <option value="PLANNING">Teritorijas plānošana</option>
          <option value="PARKS">Parki un skvēri</option>
          <option value="OTHER">Cits</option>
        </select>
      </div>
      <button type="submit">Meklēt</button>
    </form>
    <div class="count" id="count"></div>
    <table>
      <thead>
        <tr><th>Numurs</th><th>Statuss</th><th>Tēma</th><th>Saņemts</th><th>Termiņš</th><th>Kanāls</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <form class="withdraw" id="withdraw-form" novalidate>
      <h2>Atsaukt iesniegumu</h2>
      <div class="row">
        <label for="withdraw-id">Iesnieguma numurs</label>
        <input id="withdraw-id" name="id" placeholder="IES-2026-000001" autocomplete="off">
        <div class="hint">Var arī noklikšķināt uz numura sarakstā.</div>
      </div>
      <div class="row">
        <label for="reason">Atsaukšanas iemesls</label>
        <textarea id="reason" name="reason"></textarea>
        <div class="hint">10–500 rakstzīmes.</div>
        <div class="field-error" data-for="reason"></div>
      </div>
      <button type="submit" id="withdraw-submit">Atsaukt</button>
      <div class="message" id="withdraw-message" role="status"></div>
    </form>
  </main>
  <script>
    const rows = document.getElementById("rows");
    const count = document.getElementById("count");

    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text == null ? "" : text;
      return td;
    }

    async function load(event) {
      if (event) event.preventDefault();
      const params = new URLSearchParams();
      const status = document.getElementById("status").value;
      const topic = document.getElementById("topic").value;
      if (status) params.set("status", status);
      if (topic) params.set("topic", topic);
      const response = await fetch("/submissions?" + params.toString());
      const data = await response.json();
      rows.innerHTML = "";
      if (!Array.isArray(data)) {
        count.textContent = "Kļūda: " + JSON.stringify(data);
        return;
      }
      count.textContent = "Atrasti: " + data.length;
      for (const s of data) {
        const tr = document.createElement("tr");
        const idCell = document.createElement("td");
        const idLink = document.createElement("button");
        idLink.type = "button";
        idLink.className = "id-link";
        idLink.textContent = s.id;
        idLink.addEventListener("click", () => {
          withdrawId.value = s.id;
          reason.focus();
        });
        idCell.appendChild(idLink);
        tr.appendChild(idCell);
        [s.status, s.topic, s.receivedAt.slice(0, 10), s.dueDate, s.replyChannel]
          .forEach((value) => tr.appendChild(cell(value)));
        rows.appendChild(tr);
      }
    }

    // CR-A: atsaukšana. Pārbaudes dara API, forma tikai parāda API atbildi.
    const ISSUE_TEXT = {
      REQUIRED: "Obligāts lauks",
      INVALID_FORMAT: "Nepareizs garums vai formāts",
      TOO_LONG: "Pārāk garš teksts",
    };
    const ERROR_TEXT = {
      VALIDATION_ERROR: "Pārbaudiet laukus",
      NOT_FOUND: "Iesniegums ar šādu numuru nav atrasts",
      INVALID_STATE: "Šajā statusā iesniegumu nevar atsaukt",
    };
    const withdrawForm = document.getElementById("withdraw-form");
    const withdrawId = document.getElementById("withdraw-id");
    const reason = document.getElementById("reason");
    const withdrawButton = document.getElementById("withdraw-submit");
    const withdrawMessage = document.getElementById("withdraw-message");

    function clearWithdrawErrors() {
      withdrawForm.querySelectorAll(".field-error").forEach((el) => (el.textContent = ""));
      withdrawForm.querySelectorAll(".invalid").forEach((el) => el.classList.remove("invalid"));
      withdrawMessage.className = "message";
      withdrawMessage.textContent = "";
    }

    function showWithdrawError(status, body) {
      const error = (body && body.error) || {};
      const lines = [`Iesniegums nav atsaukts (HTTP ${status}${error.code ? ", " + error.code : ""})`];
      if (ERROR_TEXT[error.code]) lines.push(ERROR_TEXT[error.code]);
      for (const detail of error.details || []) {
        const text = ISSUE_TEXT[detail.issue] || detail.issue;
        const target = withdrawForm.querySelector(`.field-error[data-for="${detail.field}"]`);
        if (target) {
          target.textContent = text;
          document.getElementById(detail.field)?.classList.add("invalid");
        } else {
          lines.push(`${detail.field}: ${text}`);
        }
      }
      withdrawMessage.className = "message error";
      withdrawMessage.textContent = lines.join(". ");
    }

    withdrawForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearWithdrawErrors();
      const id = withdrawId.value.trim();
      if (!id) {
        // Bez numura nav adreses, uz kuru sūtīt pieprasījumu.
        withdrawMessage.className = "message error";
        withdrawMessage.textContent = "Norādiet iesnieguma numuru.";
        withdrawId.classList.add("invalid");
        return;
      }
      // Tukšu iemeslu nesūtām: API pats pasaka, ka tas trūkst.
      const payload = reason.value === "" ? {} : { reason: reason.value };
      withdrawButton.disabled = true;
      try {
        const response = await fetch(`/submissions/${encodeURIComponent(id)}/withdraw`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        let body = null;
        try { body = await response.json(); } catch (e) { /* nav JSON */ }
        if (response.status === 200) {
          withdrawMessage.className = "message ok";
          withdrawMessage.textContent = `Iesniegums ${body.id} atsaukts. Statuss: ${body.status}.`;
          reason.value = "";
          load();
        } else {
          showWithdrawError(response.status, body);
        }
      } catch (error) {
        withdrawMessage.className = "message error";
        withdrawMessage.textContent = "Neizdevās sazināties ar serveri.";
      } finally {
        withdrawButton.disabled = false;
      }
    });

    document.getElementById("filters").addEventListener("submit", load);
    load();
  </script>
</body>
</html>
